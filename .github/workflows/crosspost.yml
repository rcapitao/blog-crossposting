name: Crosspost new blog posts

on:
  # Gatilho principal: disparado pelo workflow de deploy do blog
  # (rcapitao/rcapitao-vhugo) assim que um post novo é publicado.
  repository_dispatch:
    types: [blog-published]
  schedule:
    # Rede de segurança a cada 3h, das 08h às 23h no horário de Brasília
    # (UTC-3) = 11h-02h UTC, caso o repository_dispatch falhe por algum motivo.
    - cron: "0 11,14,17,20,23,2 * * *"
  workflow_dispatch:
    inputs:
      seed_only:
        description: "Seed state.json with existing posts without posting them"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: crosspost
  cancel-in-progress: false

jobs:
  crosspost:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crossposter
        env:
          FEED_URL: ${{ vars.FEED_URL }}
          MASTODON_BASE_URL: ${{ vars.MASTODON_BASE_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          SEED_ONLY: ${{ (github.event_name == 'workflow_dispatch' && inputs.seed_only) && '1' || '' }}
        run: python crosspost.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update crosspost state"
          git push
